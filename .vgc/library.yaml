version: "1.0.0"
name: "Landing Page Architecture Library"

nodeComponents:
  # Pages
  page:
    label: "Page"
    description: "Next.js page component"
    color: "#3b82f6"
    shape: "rectangle"

  apiRoute:
    label: "API Route"
    description: "Next.js API endpoint"
    color: "#10b981"
    shape: "rounded-rectangle"

  # UI Components
  component:
    label: "Component"
    description: "React UI component"
    color: "#8b5cf6"
    shape: "ellipse"

  section:
    label: "Section"
    description: "Page section component"
    color: "#a78bfa"
    shape: "ellipse"

  layout:
    label: "Layout"
    description: "Layout component"
    color: "#ec4899"
    shape: "rectangle"

  # Infrastructure
  externalService:
    label: "External Service"
    description: "Third-party service or API"
    color: "#f59e0b"
    shape: "hexagon"

  database:
    label: "Database"
    description: "Database or data store"
    color: "#ef4444"
    shape: "cylinder"

  # Configuration
  config:
    label: "Config"
    description: "Configuration file or module"
    color: "#6b7280"
    shape: "document"

  hook:
    label: "Hook"
    description: "React custom hook"
    color: "#06b6d4"
    shape: "ellipse"

  util:
    label: "Utility"
    description: "Utility function or library"
    color: "#84cc16"
    shape: "ellipse"

edgeComponents:
  # Component relationships
  imports:
    label: "imports"
    description: "Module import relationship"
    color: "#64748b"
    style: "solid"
    arrowhead: "arrow"

  renders:
    label: "renders"
    description: "Component renders another component"
    color: "#8b5cf6"
    style: "solid"
    arrowhead: "arrow"

  navigatesTo:
    label: "navigates to"
    description: "Navigation link or redirect"
    color: "#3b82f6"
    style: "dashed"
    arrowhead: "arrow"

  # API relationships
  apiCall:
    label: "calls"
    description: "Makes API request"
    color: "#10b981"
    style: "solid"
    arrowhead: "arrow"
    thickness: 2

  fetchesFrom:
    label: "fetches from"
    description: "Fetches data from external source"
    color: "#f59e0b"
    style: "dashed"
    arrowhead: "arrow"

  storesIn:
    label: "stores in"
    description: "Stores data in database or storage"
    color: "#ef4444"
    style: "solid"
    arrowhead: "arrow"

  # Data flow
  dataFlow:
    label: "data flow"
    description: "Data passed between components"
    color: "#06b6d4"
    style: "dotted"
    arrowhead: "arrow"

  uses:
    label: "uses"
    description: "Uses utility, hook, or config"
    color: "#84cc16"
    style: "dashed"
    arrowhead: "arrow"
